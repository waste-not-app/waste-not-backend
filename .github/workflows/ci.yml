name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify & Test
    timeout-minutes: 25
    runs-on: [self-hosted, alberd-staging-backend]
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wastenot_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d wastenot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-only-password@localhost:5433/wastenot_test?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: python3 scripts/check_contracts.py contracts/ai contracts/ai.lock.json
      - run: python3 -m unittest discover -s deploy -v
      - run: make ci
      - name: Build container image
        run: docker build -t wastenot-api:ci .
