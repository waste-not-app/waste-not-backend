name: Backend CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wastenot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d wastenot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/wastenot_test?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements-runtime.lock
      - run: python -m pip install --require-hashes -r ai/requirements-runtime.lock
      - run: python -m pip install pytest==9.2.0 pip-audit==2.10.1
      - run: python ai/verify_source.py
      - run: python -m pytest ai/tests -q -p no:cacheprovider
        env:
          PYTHONPATH: ai/runtime/src
      - run: python ai/audit_dependencies.py
      - run: go mod verify
      - run: python3 -m unittest discover -s deploy -v
      - run: make check
      - run: make vuln
      - run: make build
      - run: python3 scripts/package_release.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ github.sha }}
          path: bin/release.tar
          retention-days: 7
      - name: Build Docker image
        run: docker build --tag wastenot-backend:${{ github.sha }} .
      - name: Package Docker image artifact
        run: |
          mkdir -p docker-image
          docker save wastenot-backend:${{ github.sha }} | gzip > docker-image/wastenot-backend.tar.gz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docker-image-${{ github.sha }}
          path: docker-image/wastenot-backend.tar.gz
          retention-days: 7

  deploy:
    needs: verify
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: wastenot-vm-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: docker-image-${{ github.sha }}
          path: docker-image
      - name: Prepare dedicated SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.WASTENOT_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS || secrets.WASTENOT_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/wastenot-key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/wastenot-known-hosts"
      - name: Deploy containerized release via Blue-Green deployment
        env:
          DEPLOY_HOST: ${{ vars.VM_HOST || vars.WASTENOT_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.VM_PORT || vars.WASTENOT_DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.VM_USER || vars.WASTENOT_DEPLOY_USER }}
          IMAGE_TAG: wastenot-backend:${{ github.sha }}
        run: |
          SSH_CMD="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=$RUNNER_TEMP/wastenot-known-hosts \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -i $RUNNER_TEMP/wastenot-key -p $DEPLOY_PORT"

          echo "==> Transferring and loading Docker image into VM..."
          gzip -dc docker-image/wastenot-backend.tar.gz | $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" "docker load"

          echo "==> Syncing deployment script on VM..."
          cat deploy/deploy-bluegreen.sh | $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" "cat > /home/$DEPLOY_USER/deploy-bluegreen.sh && chmod +x /home/$DEPLOY_USER/deploy-bluegreen.sh"

          echo "==> Executing Blue-Green switch on VM..."
          $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" "/home/$DEPLOY_USER/deploy-bluegreen.sh $IMAGE_TAG"
      - name: Verify public HTTPS API
        run: |
          curl --fail --silent --show-error --max-time 15 --retry 3 --retry-delay 2 \
            https://pred-autoscaler.bccdev.id/wastenot/api/health/ready \
            --output "$RUNNER_TEMP/wastenot-health.json"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["ready"] is True' "$RUNNER_TEMP/wastenot-health.json"
      - name: Remove temporary SSH files
        if: always()
        run: rm -f "$RUNNER_TEMP/wastenot-key" "$RUNNER_TEMP/wastenot-known-hosts"
