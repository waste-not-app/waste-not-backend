name: Backend CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wastenot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d wastenot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/wastenot_test?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: python3 -m unittest discover -s deploy -v
      - run: make check
      - run: make vuln
      - run: make build
      - run: python3 scripts/package_release.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ github.sha }}
          path: bin/release.tar
          retention-days: 7
      - run: docker build --tag wastenot-backend:ci .

  deploy:
    needs: verify
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: wastenot-vm-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-${{ github.sha }}
          path: release
      - name: Prepare dedicated SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.WASTENOT_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.WASTENOT_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/wastenot-key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/wastenot-known-hosts"
      - name: Deploy verified release to the isolated WasteNot service
        env:
          DEPLOY_HOST: ${{ vars.WASTENOT_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.WASTENOT_DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.WASTENOT_DEPLOY_USER }}
        run: |
          ssh -C -T -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/wastenot-known-hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -i "$RUNNER_TEMP/wastenot-key" -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" < release/release.tar
      - name: Verify public HTTPS API
        run: |
          curl --fail --silent --show-error --max-time 15 --retry 2 --retry-delay 2 \
            https://pred-autoscaler.bccdev.id/wastenot/api/health/ready \
            --output "$RUNNER_TEMP/wastenot-health.json"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["ready"] is True' "$RUNNER_TEMP/wastenot-health.json"
      - name: Remove temporary SSH files
        if: always()
        run: rm -f "$RUNNER_TEMP/wastenot-key" "$RUNNER_TEMP/wastenot-known-hosts"
