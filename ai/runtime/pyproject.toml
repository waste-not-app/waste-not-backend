[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wastenot-ai-runtime"
version = "0.1.0"
description = "Pinned WasteNot Python decision and YOLO workers for the Go API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.2",
  "httpx==0.28.1",
  "Pillow==13.0.0",
  "python-dotenv==1.2.4",
  "python-multipart==0.0.33",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wastenot_ai = ["data/*.json", "web/*.html", "web/*.css", "web/*.js", "web/*.ttf", "web/*.txt"]
