services:
  db:
    image: postgres:18-bookworm
    container_name: wastenot-db
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wastenot-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: wastenot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wastenot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wastenot -d wastenot"]
      interval: 3s
      timeout: 3s
      retries: 20

  api-blue:
    image: wastenot-backend:${IMAGE_TAG:-latest}
    container_name: wastenot-api-blue
    network_mode: host
    restart: always
    env_file:
      - /etc/wastenot/wastenot.env
    environment:
      HTTP_ADDR: "127.0.0.1:18081"

  api-green:
    image: wastenot-backend:${IMAGE_TAG:-latest}
    container_name: wastenot-api-green
    network_mode: host
    restart: always
    env_file:
      - /etc/wastenot/wastenot.env
    environment:
      HTTP_ADDR: "127.0.0.1:18082"

volumes:
  wastenot-postgres-data:
    name: wastenot-postgres-data
    external: true
