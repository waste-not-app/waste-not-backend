apiVersion: v1
kind: Namespace
metadata:
  name: wastenot
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: wastenot-budget
  namespace: wastenot
spec:
  hard:
    requests.cpu: 250m
    requests.memory: 256Mi
    limits.cpu: '1'
    limits.memory: 512Mi
    requests.storage: 2Gi
    persistentvolumeclaims: '1'
    pods: '2'
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: wastenot
spec:
  selector:
    app: wastenot-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: wastenot
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: wastenot-postgres
  template:
    metadata:
      labels:
        app: wastenot-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
          args: [-c, shared_buffers=32MB, -c, max_connections=30]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: POSTGRES_USER
              value: wastenot_owner
            - name: POSTGRES_DB
              value: wastenot
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            exec:
              command: [pg_isready, -U, wastenot_owner, -d, wastenot]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, wastenot_owner, -d, wastenot]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-private
  namespace: wastenot
spec:
  podSelector:
    matchLabels:
      app: wastenot-postgres
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
