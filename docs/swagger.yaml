host: localhost:8080
info:
  contact: {}
  description: API Documentation for WasteNot Android Backend (Waste Logging, Gamification,
    Guides & AI Scan)
  title: WasteNot API
  version: "1.0"
paths:
  /health/live:
    get:
      description: Check if the API process is alive
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_system.HealthLiveRes'
      summary: Liveness Probe
      tags:
      - System
  /health/ready:
    get:
      description: Check if PostgreSQL database and core schema migrations are ready
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_system.HealthReadyRes'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_waste-not-app_waste-not-backend_internal_response.ErrorResponse'
      summary: Readiness Probe
      tags:
      - System
  /v1/achievements:
    get:
      description: Retrieve achievement definitions and derived unlock/progress state
        for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_waste-not-app_waste-not-backend_internal_response.SuccessDataRes-array_internal_modules_achievements_AchievementRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_waste-not-app_waste-not-backend_internal_response.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_waste-not-app_waste-not-backend_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List User Achievements
      tags:
      - Achievements
  /v1/ai/detections:
    post:
      consumes:
      - multipart/form-data
      description: Upload a JPEG or PNG image (max 5MB) to detect waste object candidates
      parameters:
      - description: Idempotency UUID
        in: formData
        name: client_request_id
        required: true
        type: string
      - description: Waste image file (image/jpeg or image/png)
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_waste-not-app_waste-not-backend_internal_response.SuccessDataRes-internal_modules_ai_AIDetectionRes'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_waste-not-app_waste-not-backend_internal_response.SuccessDataRes-internal_modules_ai_AIDetectionRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_waste-not-app_waste-not-backend_internal_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_waste-not-app_waste-not-backend_internal_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_waste-not-app_waste-not-backend_internal_response.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/github_com_waste-not-app_waste-not-backend_internal_response.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/github_com_waste-not-app_waste-not-backend_internal_response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_waste-not-app_waste-not-backend_internal_response.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_waste-not-app_waste-not-backend_internal_response.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/github_com_waste-not-app_waste-not-backend_internal_response.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_waste-not-app_waste-not-backend_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Detect Waste Object from Image
      tags:
      - AI Scan
  /v1/ai/detections/{id}:
    delete:
      description: Soft-delete an AI detection operation and its snapshot
      parameters:
      - description: Detection UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_waste-not-app_waste-not-backend_internal_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_waste-not-app_waste-not-backend_internal_response.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_waste-not-app_waste-not-backend_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete AI Detection Session
      tags:
      - AI Scan
  /v1/ai/objects:
    get:
      description: Retrieve the catalog of waste objects detectable by the AI vision
        service
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_waste-not-app_waste-not-backend_internal_response.SuccessDataRes-internal_modules_ai_AICatalogRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_waste-not-app_waste-not-backend_internal_response.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/github_com_waste-not-app_waste-not-backend_internal_response.ErrorResponse'
        "503":
