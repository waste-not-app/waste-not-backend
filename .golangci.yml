version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*mime/multipart.Part).Close
        - (github.com/jackc/pgx/v5.Tx).Rollback
    gosec:
      excludes:
        - G104
        - G115
  exclusions:
    generated: strict
    paths:
      - docs/
      - internal/shared/db/
    rules:
      - path: _test\.go
        linters: [errcheck, gosec, noctx, usestdlibvars]
      - path: _test\.go
        text: "QF"
        linters: [staticcheck]
      - path: cmd/
        text: G703
        linters: [gosec]
      - path: internal/modules/photos/storage\.go
        text: G304
        linters: [gosec]
      - path: internal/modules/auth/account_handler\.go
        text: G101
        linters: [gosec]
      - path: internal/modules/auth/account_service\.go
        text: G407
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/waste-not-app/waste-not-backend
  exclusions:
    generated: strict
    paths:
      - docs/
      - internal/shared/db/
